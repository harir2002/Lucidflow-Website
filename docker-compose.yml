version: '3.8'

services:
  sbawebuat010:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_LUCIDFLOW_ENQUIRY_ENDPOINT=${VITE_LUCIDFLOW_ENQUIRY_ENDPOINT}
        - VITE_GA_MEASUREMENT_ID=${VITE_GA_MEASUREMENT_ID}
        - VITE_GA4_PROPERTY_ID=${VITE_GA4_PROPERTY_ID}
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL}
    container_name: sbamodern-app
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - sba-network

networks:
  sba-network:
    driver: bridge
